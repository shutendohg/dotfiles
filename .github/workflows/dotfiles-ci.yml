name: Dotfiles CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Install mise first
      - name: Install mise
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | bash
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"

      - name: Apply dotfiles
        run: |
          curl -fsLS get.chezmoi.io | bash -s -- -b ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chezmoi init --apply .
          # Like `mise activate` in config.fish: put the tools installed by mise on $PATH
          "$HOME/.local/bin/mise" bin-paths | tee -a "$GITHUB_PATH"

      - name: Install Neovim nightly
        id: nvim
        run: |
          sudo add-apt-repository -y ppa:neovim-ppa/unstable
          sudo apt-get update -y
          sudo apt-get install -y neovim

      # The Neovim checks fail when Neovim or a plugin reports an error, see
      # .github/nvim-ci/check.sh. Each one runs even if the previous one failed.
      - name: Lazy sync
        run: bash .github/nvim-ci/check.sh sync

      - name: Startup check
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' }}
        run: bash .github/nvim-ci/check.sh startup

      - name: Run :checkhealth
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' }}
        run: bash .github/nvim-ci/check.sh health
